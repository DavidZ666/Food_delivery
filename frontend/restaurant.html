<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant details — ByteBites</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-header__inner">
      <a class="brand" href="./">ByteBites</a>
      <nav aria-label="Primary">
        <a href="./">Restaurants</a>
        <a href="create-restaurant.html">Create a restaurant</a>
        <a href="edit-restaurant.html">Edit a restaurant</a>
        <a href="account.html">Account</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <p class="back"><a href="./">Back to restaurants</a></p>
    <h1 id="restaurant-name">Restaurant details</h1>
    <p><a id="edit-link" hidden>Edit this restaurant</a></p>
    <p id="restaurant-status" role="status" aria-live="polite"></p>
    <dl id="restaurant-details"></dl>
    <section id="menu-section" aria-labelledby="menu-heading" hidden>
      <h2 id="menu-heading">Menu</h2>
      <p id="menu-status" role="status" aria-live="polite"></p>
      <button id="retry-menu" type="button" hidden>Retry menu</button>
      <ul id="menu-list"></ul>
    </section>
    <section id="cart-section" aria-labelledby="cart-heading">
      <h2 id="cart-heading">Your cart</h2>

      <p id="cart-status" role="status" aria-live="polite"></p>
      <p id="cart-sign-in" hidden>
        <a href="sign-in.html">Sign in</a> with a customer account to use the cart.
      </p>

      <button id="cart-retry" type="button" hidden>Reload cart</button>

      <div id="cart-content" hidden>
        <p id="cart-restaurant"></p>
        <p id="cart-empty" hidden>Your cart is empty.</p>
        <ul id="cart-items"></ul>

        <p>Subtotal: <strong id="cart-subtotal"></strong></p>
        <p>Total: <strong id="cart-total"></strong></p>

        <button id="cart-clear" type="button">Clear cart</button>
      </div>
    </section>
  </main>
  <script type="module" src="js/restaurant-details.js"></script>
</body>
</html>
