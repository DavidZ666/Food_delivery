name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Automated tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: >-
          python -m pytest tests
          --verbose
          --strict-config
          --strict-markers
          --junitxml=pytest-results.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test "tests/frontend/*.test.mjs"

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser acceptance against isolated data
        env:
          FOOD_DELIVERY_PYTHON: python
        run: npm run test:e2e

      - name: Upload browser acceptance results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish pytest summary
        if: ${{ always() }}
        run: python scripts/summarize_tests.py pytest-results.xml

      - name: Upload pytest results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-3.14
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
